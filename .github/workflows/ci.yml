name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Форматирование
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component rustfmt && rustup default stable
      - run: cargo fmt --all --check

  check:
    name: Clippy и тесты (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  build:
    name: Сборка exe
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: folder-guard-${{ github.sha }}-windows-x64
          path: |
            target/release/folder-guard.exe
            target/release/ransim.exe
          retention-days: 14
