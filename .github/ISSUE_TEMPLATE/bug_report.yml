name: Ошибка
description: Программа работает не так, как ожидалось
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо, что сообщаете об ошибке! Если это **способ обойти защиту** — не пишите здесь,
        а сообщите приватно (см. SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Версия Folder Guard
      description: Видна внизу боковой панели или по `folder-guard.exe --version`
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Версия Windows
      description: "Win+R → winver"
      placeholder: "Windows 11 24H2 (сборка 26100)"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Режим защиты
      description: Внизу боковой панели
      options:
        - "Режим: ETW, админ"
        - "Режим: ограниченный"
        - "Не знаю"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Что произошло
      description: Что вы делали, что ожидали и что получилось
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести
      placeholder: |
        1. Запустить от администратора
        2. ransim init C:\fg-test
        3. ...
  - type: textarea
    id: journal
    attributes:
      label: Записи журнала
      description: Раздел «Журнал событий» — строки вокруг момента ошибки. Пути с личными данными можно заменить.
      render: text
